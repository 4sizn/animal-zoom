        { id: uid(), authorId: "liam", authorName: "Liam", authorAvatarUrl: "https://lh3.googleusercontent.com/aida-public/AB6AXuAxt-gZckIOrgUHwcwhnNoB3v5KIjDe3PJ6izSg8xQO0_P8pg-53eXCZSKa5NA4uHK1cFTTm9WGkn1BDT_nfYcZDMZ2Jjkyr6XA1vaI0eOOZyo6tG6x4sHcNN4oIpsWC4czAAhmbF41aDjYms5ek0_h7woky6mY6RUF0SiwvLLjghPE1D4nNWlACn1oo-zJ-TVWXvOrrdi7cOnLD1e1f1Xc5ylunvm79-L9EQhSVzWHbkx5C-b-c2oEcJAy3gpxe97WHHNQVoIQWAg", text: "No problem!", createdAt: now - 1000 * 40 },

    try {
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];

  }

  function saveMessages(messages) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    } catch {
      // ignore
    }
  }

  let messages = loadMessages();
  let unreadCount = 0;

  function isNearBottom(scroller) {
    const threshold = 40;
    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < threshold;
  }

  function scrollToBottom() {
    const scroller = messageList.parentElement;
    if (!scroller) return;
    scroller.scrollTop = scroller.scrollHeight;
  }

  function setChipVisible(visible) {
    newMessagesChip.classList.toggle("hidden", !visible);
    if (!visible) {
      unreadCount = 0;
    }
    newMessagesText.textContent = unreadCount > 0 ? `New messages (${unreadCount})` : "New messages";
  }

  function escapeText(text) {
    return text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function render() {
    const scroller = messageList.parentElement;
    const shouldStick = scroller ? isNearBottom(scroller) : true;

    messageList.innerHTML = "";

    let prevAuthorId = null;
    for (const message of messages) {
      const isMe = message.authorId === "me";
      const isNewGroup = message.authorId !== prevAuthorId;

      const row = document.createElement("div");
      row.className = isMe ? "flex flex-row-reverse gap-3" : "flex gap-3";

      if (isMe) {
        if (isNewGroup) {
          const meBadge = document.createElement("div");
          meBadge.className = "w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white text-xs font-bold";
          meBadge.textContent = "ME";
          row.appendChild(meBadge);
        } else {
          const spacer = document.createElement("div");
          spacer.className = "w-10";
          row.appendChild(spacer);
        }

        const stack = document.createElement("div");
        stack.className = "space-y-1 max-w-[80%] flex flex-col items-end";

        if (isNewGroup) {
          const meta = document.createElement("p");
          meta.className = "text-xs font-bold text-slate-500 dark:text-slate-400";
          meta.textContent = `${message.authorName} - ${formatTime(message.createdAt)}`;
          stack.appendChild(meta);
        }

        const bubble = document.createElement("div");
        bubble.className = "bg-primary text-white p-3 rounded-2xl text-sm shadow-md";
        if (isNewGroup) {
          bubble.className += " rounded-tr-none";
        }
        bubble.innerHTML = escapeText(message.text).replaceAll("\n", "<br/>");
        stack.appendChild(bubble);

        row.appendChild(stack);
      } else {
        if (isNewGroup) {
          const avatar = document.createElement("img");
          avatar.className = "w-10 h-10 rounded-full object-cover";
          avatar.alt = `Avatar ${message.authorName}`;
          if (message.authorAvatarUrl) {
            avatar.src = message.authorAvatarUrl;
          }
          row.appendChild(avatar);
        } else {
          const spacer = document.createElement("div");
          spacer.className = "w-10";
          row.appendChild(spacer);
        }

        const stack = document.createElement("div");
        stack.className = "space-y-1 max-w-[80%]";

        if (isNewGroup) {
          const meta = document.createElement("p");
          meta.className = "text-xs font-bold text-slate-500 dark:text-slate-400";
          meta.textContent = `${message.authorName} - ${formatTime(message.createdAt)}`;
          stack.appendChild(meta);
        }

        const bubble = document.createElement("div");
        bubble.className = "bg-slate-100 dark:bg-bubble-other p-3 rounded-2xl text-sm";
        if (isNewGroup) {
          bubble.className += " rounded-tl-none";
        }
        bubble.innerHTML = escapeText(message.text).replaceAll("\n", "<br/>");
        stack.appendChild(bubble);

        row.appendChild(stack);
      }

      messageList.appendChild(row);
      prevAuthorId = message.authorId;
    }

    if (shouldStick) {
      scrollToBottom();
      setChipVisible(false);
    }
  }

  function openChat() {
    chatSidebar.classList.remove("hidden");
    chatSidebar.classList.remove("translate-x-full");
    chatInput.focus();
    scrollToBottom();
  }

  function closeChat() {
    if (window.matchMedia && window.matchMedia("(min-width: 768px)").matches) {
      chatSidebar.classList.add("hidden");
      return;
    }
    chatSidebar.classList.add("translate-x-full");
  }

  function sendMessage(text) {
    const trimmed = text.replace(/\s+$/g, "");
    if (!trimmed.trim()) return;

    messages.push({
      id: uid(),
      authorId: "me",
      authorName: "Jen",
      authorAvatarUrl: null,
      text: trimmed,
      createdAt: Date.now(),
    });
    saveMessages(messages);
    render();
    scrollToBottom();
    setChipVisible(false);
  }

  function receiveMessage(message) {
    const scroller = messageList.parentElement;
    const shouldStick = scroller ? isNearBottom(scroller) : true;

    messages.push(message);
    saveMessages(messages);
    render();

    if (shouldStick) {
      scrollToBottom();
      setChipVisible(false);
      return;
    }

    unreadCount += 1;
    setChipVisible(true);
  }

  openChatButton.addEventListener("click", openChat);
  closeChatButton.addEventListener("click", closeChat);
  sendButton.addEventListener("click", () => {
    const value = chatInput.value;
    chatInput.value = "";
    sendMessage(value);
    chatInput.focus();
  });
  scrollToBottomButton.addEventListener("click", () => {
    scrollToBottom();
    setChipVisible(false);
  });

  chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      const value = chatInput.value;
      chatInput.value = "";
      sendMessage(value);
      chatInput.focus();
    }
  });

  const scroller = messageList.parentElement;
  if (scroller) {
    scroller.addEventListener("scroll", () => {
      if (isNearBottom(scroller)) {
        setChipVisible(false);
      }
    });
  }

  // Default state: on mobile, keep chat closed.
  if (window.matchMedia && window.matchMedia("(min-width: 768px)").matches) {
    chatSidebar.classList.remove("translate-x-full");
    chatSidebar.classList.remove("hidden");
  } else {
    chatSidebar.classList.add("translate-x-full");
    chatSidebar.classList.remove("hidden");
  }

  // Initial render
  render();
  scrollToBottom();

  // Light demo behavior: simulate incoming messages.
  const otherAuthors = [
    {
      authorId: "marina",
      authorName: "Marina",
      authorAvatarUrl: "https://lh3.googleusercontent.com/aida-public/AB6AXuCGtlxIdZ6DCigRf3Dh6qYJAAc_9qh36Amm75FPZAnkenslQ_ITGEDPXzVMUWQ5dQpwJ5bgJDRuHzHb_TdV7_aZyk7KJEYKsvP_adkApCYAW1NTQrHvYHyIjMxveCUieMFhNdy4jAPL2lPG1GsGs8Iq-9DRSyw1Ee9N1E7NygE3qObUvmGCMeCo0RTy47vUMtpR0x-jNVpLipsZ1zxxjJv0E_Ifo0LeJSTy8UdsIq7fTrppZtH9fJgErAoCfVwHgyeP3bxDPi25oOw",
    },
    {
      authorId: "sam",
      authorName: "Sam",
      authorAvatarUrl: "https://lh3.googleusercontent.com/aida-public/AB6AXuA6fFbiEsl2ggrgWz7w3yHIIDCOaTwSgMSbl0EUdSkG_VJOrHuFPwstm1GE69CUl3Lz1FjYLvJ3M6XalgmUzrJsciVK0uCZtnXv4SP2XDe0FufuoXFo-tMq9LxnMi6nXwQdA-DFDeFY-Q4co10Q91u84FmfHugJkmGsQJSF6JVonrhLxlKYO4-VagETSWbikiihtU0J4il-9-1IhSUzGG2eoJXIr6_5hMozBtGDDHUQkGFMTxy6F-AhlrW1Yue-iJMq52EfLItlmak",
    },
    {
      authorId: "biagis",
      authorName: "Biagis",
      authorAvatarUrl: "https://lh3.googleusercontent.com/aida-public/AB6AXuAdadjP9lUN-TEYcgvaMKakVoEjt5cXYvFPaJH90iV0_8NKk3E4r6vnFZhU9xGUEabov2fwjcKAf12ot4kGyt2i5RKZR9BO30RqAFuImVZ1mlVp_H25srG5r6RkWwl9Izmlvh-AKMgnxgWJNSZjryYxoQdR846pXAA1SijbvkyvLzXTSNLbGxKJ_Jq_ODhceOhNC7eGt95dIlmwYtGCJcSY9OXnMbp5RT7CJrVJcdW6F5HjjNlBhyCGlEZvM7E9VPJC77hl8PJyq1s",
    },
    {
      authorId: "liam",
      authorName: "Liam",
      authorAvatarUrl: "https://lh3.googleusercontent.com/aida-public/AB6AXuAxt-gZckIOrgUHwcwhnNoB3v5KIjDe3PJ6izSg8xQO0_P8pg-53eXCZSKa5NA4uHK1cFTTm9WGkn1BDT_nfYcZDMZ2Jjkyr6XA1vaI0eOOZyo6tG6x4sHcNN4oIpsWC4czAAhmbF41aDjYms5ek0_h7woky6mY6RUF0SiwvLLjghPE1D4nNWlACn1oo-zJ-TVWXvOrrdi7cOnLD1e1f1Xc5ylunvm79-L9EQhSVzWHbkx5C-b-c2oEcJAy3gpxe97WHHNQVoIQWAg",
    },
  ];
  const cannedTexts = [
    "What section are you working on?",
    "Nice - I can help review it.",
    "Give me 2 minutes, grabbing notes.",
    "Anyone want to pair on this part?",
    "I think we should keep it simple.",
    "Agreed. Let's ship a demo first.",
  ];

  function randomBetween(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function scheduleNextIncoming() {
    const delayMs = randomBetween(7000, 14000);
    window.setTimeout(() => {
      const author = otherAuthors[randomBetween(0, otherAuthors.length - 1)];
      const text = cannedTexts[randomBetween(0, cannedTexts.length - 1)];
      receiveMessage({
        id: uid(),
        authorId: author.authorId,
        authorName: author.authorName,
        authorAvatarUrl: author.authorAvatarUrl,
        text,
        createdAt: Date.now(),
      });
      scheduleNextIncoming();
    }, delayMs);
  }

  scheduleNextIncoming();
})();
</script>
