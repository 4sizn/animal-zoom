services:
  postgres:
    image: postgres:16-alpine
    container_name: animal-zoom-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: animal-zoom-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: animal-zoom-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./server/minio/cors.json:/config/cors.json:ro
    command:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO to be ready...";
          sleep 1;
        done;
        mc mb --ignore-existing local/assets;
        mc cors set local/assets /config/cors.json;
    restart: "no"

  minio-seed:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: animal-zoom-minio-seed
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./client/babylon-web/public/assets:/seed/assets:ro
    command:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO to be ready...";
          sleep 1;
        done;
        mc mb --ignore-existing local/assets;
        mc mirror --overwrite /seed/assets local/assets;
    restart: "no"

volumes:
  postgres_data:
  minio_data:
